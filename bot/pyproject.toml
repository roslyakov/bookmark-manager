[project]
name = "bookmarks-bot"
version = "0.1.0"
description = "Telegram bot for the bookmark manager (webhook mode)"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.4,<4.0",
    "aiohttp>=3.9,<4.0",
    "pydantic-settings>=2.2,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Note: the shared `db` package (SQLAlchemy models, session helpers) is not
# declared as a PyPI dependency here — it's installed separately from ../db
# (see bot/Dockerfile), since it's a local workspace package, not published.
