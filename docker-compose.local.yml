# Local development overlay — no reverse proxy, so publish the bot's HTTP
# port directly to the host. Use with a tunnel (ngrok/cloudflared) to give
# Telegram a public HTTPS URL for TELEGRAM_WEBHOOK_URL during local testing.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml \
#     --profile local-db up --build
services:
  bot:
    ports:
      - "${BOT_HTTP_PORT:-8080}:8080"
